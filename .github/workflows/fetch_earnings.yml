name: Fetch Earnings Dates

on:
  schedule:
    - cron: '0 6 * * 1-5'  # En gång per dag kl 08:00 svensk tid
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch earnings dates
        run: python fetch_earnings.py

      - name: Commit and push data
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git fetch origin main
          git reset --soft origin/main
          git add earnings.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update earnings dates $(date '+%Y-%m-%d')"
          git push origin main
