    {sym:null,display:"LANNEBO SVERIGE",namn:"Lannebo Sverige Plus",sektor:"Sverigefond aktiv",avanza:"https://www.avanza.se/fonder/om-fonden.html/155953/lannebo-sverige-plus",anledningar:["Slår Sverigeindex konsekvent","Fokus på bolagsanalys","Rimlig avgift 0,6%"],risker:["Kan underprestera index","Ingen global diversifiering"]},
  ]
};

const COLORS={KOP:"#00cc66",HALL:"#ffaa00",SALJ:"#ff4444"};
const BGS={KOP:"#00110a",HALL:"#110d00",SALJ:"#110000"};
const TAGS={KOP:"⬆ KÖP",HALL:"➡ HÅLL",SALJ:"⬇ SÄLJ"};
const VARFOR={KOP:"VARFÖR KÖPA",HALL:"VARFÖR HÅLLA",SALJ:"VARFÖR SÄLJA"};
const categories=Object.keys(STOCKS);
let activeTab=categories[0];
let liveData={};

function calcRSI(c,p=14){
  if(c.length<p+1)return null;
  let g=0,l=0;
  for(let i=c.length-p;i<c.length;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d;}
  const ag=g/p,al=l/p;
  return al===0?100:+(100-100/(1+ag/al)).toFixed(1);
}
function calcMA(c,p){
  if(c.length<p)return null;
  return +(c.slice(-p).reduce((a,b)=>a+b,0)/p).toFixed(2);
}
function computeSignal(rsi,ma50,ma200,chg){
  let s=5;
  if(rsi!=null){if(rsi<30)s+=3;else if(rsi<40)s+=2;else if(rsi<45)s+=1;else if(rsi>75)s-=3;else if(rsi>65)s-=2;else if(rsi>58)s-=1;}
  if(ma50!=null&&ma200!=null){const g=((ma50-ma200)/ma200)*100;if(g>3)s+=2;else if(g>0)s+=1;else if(g<-3)s-=2;else s-=1;}
  if(chg!=null){if(chg>3)s+=1;else if(chg<-3)s-=1;}
  s=Math.max(1,Math.min(10,s));
  return{signal:s>=7?"KOP":s<=4?"SALJ":"HALL",styrka:s};
}

function parseYF(d){
  const res=d?.chart?.result?.[0];
  if(!res)return null;
  const closes=(res.indicators?.quote?.[0]?.close||[]).filter(v=>v!=null);
  if(closes.length<20)return null;
  const meta=res.meta||{};
  const price=meta.regularMarketPrice||closes[closes.length-1];
  const prev=meta.chartPreviousClose||meta.previousClose||closes[closes.length-2];
  const change=prev?((price-prev)/prev)*100:0;
  return{closes,price,change};
}

async function fetchStock(sym){
  const enc=encodeURIComponent(sym);
  const yf=`https://query1.finance.yahoo.com/v8/finance/chart/${enc}?interval=1d&range=1y`;
  
  // Try multiple CORS-open proxies for Yahoo Finance
  const attempts=[
    // yfapi.net - open Yahoo Finance CORS proxy
    ()=>fetch(`https://yfapi.net/v8/finance/chart/${enc}?interval=1d&range=1y`,{
      headers:{"X-API-KEY":""},signal:AbortSignal.timeout(8000)
    }),
    // corsproxy.io
    ()=>fetch(`https://corsproxy.io/?url=${encodeURIComponent(yf)}`,{
      signal:AbortSignal.timeout(8000)
    }),
    // allorigins
    ()=>fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(yf)}`,{
      signal:AbortSignal.timeout(8000)
    }),
    // proxy.cors.sh
    ()=>fetch(`https://proxy.cors.sh/${yf}`,{
      headers:{"x-cors-api-key":"temp"},signal:AbortSignal.timeout(8000)
    }),
    // crossorigin.me
    ()=>fetch(`https://crossorigin.me/${yf}`,{
      signal:AbortSignal.timeout(8000)
    }),
  ];

  for(const attempt of attempts){
    try{
      const r=await attempt();
      if(!r.ok)continue;
      const d=await r.json();
      const parsed=parseYF(d);
      if(parsed)return parsed;
    }catch(e){continue;}
  }
  throw new Error("Ej tillgänglig");
}

async function analyzeStock(s){
  if(!s.sym)return;
  try{
    const{closes,price,change}=await fetchStock(s.sym);
    const rsi=calcRSI(closes);
    const ma50=calcMA(closes,50);
    const ma200=calcMA(closes,200);
    const{signal,styrka}=computeSignal(rsi,ma50,ma200,change);
    liveData[s.sym]={price,change,rsi,ma50,ma200,signal,styrka,ok:true};
  }catch(e){
    liveData[s.sym]={ok:false,error:e.message};
  }
}

function buildUI(){
  const te=document.getElementById("tabs"),le=document.getElementById("lists");
  te.innerHTML="";le.innerHTML="";
  categories.forEach(cat=>{
    const tab=document.createElement("button");
    tab.className="tab"+(cat===activeTab?" active":"");
    tab.textContent=cat;tab.onclick=()=>switchTab(cat);
    te.appendChild(tab);
    const list=document.createElement("div");
    list.className="list"+(cat===activeTab?" active":"");
    list.id="list-"+cat;
    STOCKS[cat].forEach(s=>list.appendChild(buildCard(s)));
    le.appendChild(list);
  });
}

function buildCard(s){
  const live=s.sym?liveData[s.sym]:null;
  const has=live?.ok;
  const signal=has?live.signal:"HALL";
  const styrka=has?live.styrka:5;
  const c=COLORS[signal],bg=BGS[signal];
  const card=document.createElement("div");
  card.className="card";
  card.style.setProperty("--c",c);card.style.setProperty("--bg",bg);
  const dots=Array.from({length:10},(_,i)=>`<div class="dot${i<styrka?" on":""}"></div>`).join("");
  let chHtml="",techHtml="";
  if(has){
    const cc=live.change>=0?"#00cc66":"#ff4444";
    chHtml=`<span class="card-change" style="color:${cc}">${live.change>=0?"+":""}${live.change.toFixed(1)}%</span>`;
    const rc=live.rsi<35?"#00cc66":live.rsi>65?"#ff4444":"#ffaa00";
    const mc=(live.ma50&&live.ma200)?(live.ma50>live.ma200?"#00cc66":"#ff4444"):"#555";
    techHtml=`<div class="tech-row">
      <span class="tech-badge" style="color:#ccc;border-color:#333">${live.price.toFixed(2)}</span>
      ${live.rsi!=null?`<span class="tech-badge" style="color:${rc};border-color:${rc}44">RSI ${live.rsi}</span>`:""}
      ${live.ma50!=null?`<span class="tech-badge" style="color:${mc};border-color:${mc}44">MA50 ${live.ma50}</span>`:""}
      ${live.ma200!=null?`<span class="tech-badge" style="color:${mc};border-color:${mc}44">MA200 ${live.ma200}</span>`:""}
    </div>`;
  }else if(!s.sym){
    techHtml=`<div class="tech-row"><span class="tech-badge" style="color:#333">Teknisk data ej tillgänglig för fonder</span></div>`;
  }else if(live&&!live.ok){
    techHtml=`<div class="tech-row"><span class="tech-badge" style="color:#666;border-color:#333">Ej tillgänglig just nu</span></div>`;
  }else{
    techHtml=`<div class="tech-row"><span class="tech-badge" style="color:#444">Tryck Uppdatera för livedata</span></div>`;
  }
  const sum={
    KOP:`Teknisk analys pekar uppåt.${live?.rsi?` RSI ${live.rsi} indikerar köpläge.`:""}${(live?.ma50&&live?.ma200&&live.ma50>live.ma200)?" MA50 över MA200 — positiv trend.":""}`,
    HALL:`Teknisk analys neutral.${live?.rsi?` RSI ${live.rsi} i neutralt läge.`:""} Avvakta tydligare signal.`,
    SALJ:`Teknisk analys pekar nedåt.${live?.rsi?` RSI ${live.rsi} — överköpt läge.`:""}${(live?.ma50&&live?.ma200&&live.ma50<live.ma200)?" MA50 under MA200 — negativ trend.":""}`,
  };
  const summary=has?sum[signal]:"Tryck Uppdatera för teknisk analys.";
  const reasons=s.anledningar.map(r=>`<div class="reason-row"><span class="reason-icon">▸</span><span>${r}</span></div>`).join("");
  const risks=s.risker.map(r=>`<div class="risk-row"><span class="risk-icon">⚠</span><span>${r}</span></div>`).join("");
  card.innerHTML=`
    <button class="card-row" onclick="toggleCard(this)">
      <div class="card-left"><span class="card-ticker">${s.display}</span><span class="card-sektor">${s.sektor}</span></div>
      <div class="dots">${dots}</div>
      <div class="card-right">${chHtml}<span class="card-signal">${TAGS[signal]}</span><span class="card-arrow">▼</span></div>
    </button>
    <div class="card-body">
      <div class="bar-track"><div class="bar-fill" style="width:${styrka*10}%"></div></div>
      <div class="card-name-row"><span class="card-name">${s.namn}</span><span class="card-styrka">Styrka ${styrka}/10</span></div>
      ${techHtml}
      <div class="summary">${summary}</div>
      <div class="section-label">${VARFOR[signal]}</div>${reasons}
      <div class="risks"><div class="section-label">RISKER</div>${risks}</div>
      <a class="invest-btn" href="${s.avanza}" target="_blank">INVESTERA PÅ AVANZA →</a>
    </div>`;
  return card;
}

function switchTab(cat){
  activeTab=cat;
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",categories[i]===cat));
  document.querySelectorAll(".list").forEach(l=>l.classList.toggle("active",l.id==="list-"+cat));
}
function toggleCard(btn){
  const card=btn.closest(".card");
  const was=card.classList.contains("open");
  document.querySelectorAll(".card.open").forEach(c=>c.classList.remove("open"));
  if(!was)card.classList.add("open");
}

async function refreshAll(){
  const btn=document.getElementById("refresh-btn");
  const icon=document.getElementById("refresh-icon");
  const loading=document.getElementById("loading");
  const sub=document.getElementById("loading-sub");
  const prog=document.getElementById("loading-progress");
  const bar=document.getElementById("loading-bar");
  const errC=document.getElementById("err-container");
  btn.disabled=true;icon.className="spin";loading.style.display="flex";errC.innerHTML="";
  const all=Object.values(STOCKS).flat().filter(s=>s.sym);
  let done=0,ok=0;
  sub.textContent=`Hämtar alla ${all.length} aktier parallellt...`;
  prog.textContent=`0 / ${all.length}`;
  bar.style.width="5%";
  // Fetch all in parallel
  await Promise.all(all.map(async s=>{
    await analyzeStock(s);
    done++;
    if(liveData[s.sym]?.ok)ok++;
    sub.textContent=`Klar: ${done} / ${all.length}`;
    prog.textContent=`${done} / ${all.length}`;
    bar.style.width=`${Math.round((done/all.length)*100)}%`;
  }));
  loading.style.display="none";
  buildUI();
  const now=new Date();
  const date=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  const time=`${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  document.getElementById("last-updated").textContent=`Senast uppdaterad ${date} kl: ${time}`;
  document.getElementById("status-text").textContent=`${ok}/${all.length} aktier hämtade`;
  btn.disabled=false;icon.className="";
  if(ok<all.length){
    const failed=all.length-ok;
    errC.innerHTML=`<div class="info-banner">ℹ️ ${failed} aktier kunde inte hämtas just nu — Yahoo Finance kan ha tillfälliga begränsningar. Försök uppdatera igen.</div>`;
  }
}

buildUI();
</script>
