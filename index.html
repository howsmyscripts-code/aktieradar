    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

    .header-title{font-size:28px;font-weight:900;color:#fff;letter-spacing:-1px}
    .header-title span{color:#ff4444}
    .header-note{font-size:9px;color:#222;margin-top:3px;letter-spacing:2px;text-transform:uppercase}
    .topbar{display:flex;flex-direction:column;align-items:center;padding:10px 12px 4px;max-width:540px;margin:0 auto;gap:6px}
    .topbar-left{display:flex;flex-direction:column;align-items:center;gap:3px}
    .refresh-btn{background:#ff4444;color:#fff;border:none;padding:8px 16px;font-size:11px;font-weight:700;border-radius:4px;cursor:pointer;font-family:monospace;letter-spacing:1px;display:flex;align-items:center;gap:6px;white-space:nowrap}

    .last-updated{font-size:10px;color:#aaa;letter-spacing:1px;text-align:center}
    .status-text{font-size:9px;color:#555;letter-spacing:1px;text-align:center}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .spin{display:inline-block;animation:spin 1s linear infinite}
    .tabs{display:flex;overflow-x:auto;gap:0;padding:8px 12px 0;scrollbar-width:none;max-width:540px;margin:0 auto;justify-content:center}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex-shrink:0;padding:7px 13px;font-size:11px;font-family:monospace;letter-spacing:1px;border:1px solid #1e1e2e;background:#0a0a14;color:#555;cursor:pointer;text-transform:uppercase;border-radius:4px 4px 0 0;margin-right:4px}
    .tab.active{background:#0e0e1a;color:#fff;border-bottom-color:#0e0e1a}
    .legend{display:flex;justify-content:center;gap:16px;padding:7px 16px;font-size:10px}
    .legend-item{display:flex;align-items:center;gap:4px}
    .legend-dot{width:6px;height:6px;border-radius:50%}
    .list{padding:0 12px 12px;display:none;flex-direction:column;gap:8px;max-width:540px;margin:0 auto}
    .list.active{display:flex}
    .card{border-radius:10px;overflow:hidden;border:1px solid #181825;transition:border-color 0.2s}
    .card.open{border-color:var(--c)}
    .card-row{width:100%;background:#0e0e1a;border:none;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:8px;transition:background 0.2s}
    .card.open .card-row{background:var(--bg)}
    .card-left{display:flex;flex-direction:column;align-items:flex-start;width:80px;flex-shrink:0}

    .dots{display:flex;gap:3px;flex:1;justify-content:center}
    .dot{width:5px;height:5px;border-radius:50%;background:#1e1e2e;flex-shrink:0}
    .dot.on{background:var(--c)}
    .card-right{display:flex;align-items:center;gap:4px;width:140px;flex-shrink:0;justify-content:flex-end}
    .card-signal{font-size:11px;font-weight:900;color:var(--c);letter-spacing:1px;white-space:nowrap}
    .card-price{font-size:10px;color:#666;white-space:nowrap;margin-right:2px}.card-change{font-size:10px;font-weight:700;white-space:nowrap}

    .card.open .card-arrow{transform:rotate(180deg)}
    .card-body{display:none;background:var(--bg);border-top:1px solid rgba(255,255,255,0.04);padding:14px}
    .card.open .card-body{display:block}
    .bar-track{background:#111;height:3px;border-radius:2px;margin-bottom:12px}
    .bar-fill{height:100%;border-radius:2px;background:var(--c)}
    .card-name-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .card-name{font-size:14px;font-weight:700;color:#fff}
    .card-styrka{font-size:10px;color:#444}

    .tech-badge{padding:4px 8px;border-radius:4px;font-size:10px;font-family:monospace;letter-spacing:1px;background:#111;border:1px solid #222}

    .section-label{font-size:9px;letter-spacing:4px;color:#333;margin-bottom:7px;text-transform:uppercase}
    .reason-row,.risk-row{display:flex;gap:8px;margin-bottom:7px;font-size:11px;line-height:1.5;align-items:flex-start}
    .reason-row{color:#ccc}.risk-row{color:#666}
    .reason-icon{color:var(--c);flex-shrink:0}.risk-icon{color:#333;flex-shrink:0}
    .risks{margin-top:12px}

    .loading-sub{font-size:14px;color:#ddd;letter-spacing:1px;margin-top:10px;font-weight:600;text-align:center;max-width:300px}
    .loading-progress{font-size:11px;color:#666;margin-top:6px;letter-spacing:2px}

    .footer{text-align:center;font-size:9px;color:#1a1a1a;letter-spacing:2px;padding:20px 16px;text-transform:uppercase}

const COLORS={KOP:"#00cc66",HALL:"#ffaa00",SALJ:"#ff4444"};
const BGS={KOP:"#00110a",HALL:"#110d00",SALJ:"#110000"};
const TAGS={KOP:"▲ KÖP",HALL:"— HÅLL",SALJ:"▼ SÄLJ"};
const VARFOR={KOP:"VARFÖR KÖPA",HALL:"VARFÖR HÅLLA",SALJ:"VARFÖR SÄLJA"};
const categories=["Favoriter",...Object.keys(STOCKS)];
let activeTab="Favoriter";
let favorites=new Set(JSON.parse(localStorage.getItem("fav")||"[]"));
let liveData={};



// Load all data from data.json (fetched by GitHub Actions)
let stockData = {};

async function loadData() {
  try {
    const r = await fetch("data.json?t=" + Date.now());
    if (!r.ok) throw new Error("Ingen data.json");
    const d = await r.json();
    stockData = d.stocks || {};
    return d.updated || null;
  } catch(e) {
    return null;
  }
}

function loadStock(s) {
  if (!s.sym) return;
  const d = stockData[s.sym];
  if (d && d.ok) {
    liveData[s.sym] = d;
  } else {
    liveData[s.sym] = {ok: false, error: d?.error || "Ingen data"};
  }
}

function buildUI(){
  const te=document.getElementById("tabs"),le=document.getElementById("lists");
  te.innerHTML="";le.innerHTML="";
  categories.forEach(cat=>{
    const tab=document.createElement("button");
    tab.className="tab"+(cat===activeTab?" active":"");
    tab.textContent=cat==="Favoriter"?"♥ FAV":cat;
    tab.onclick=()=>switchTab(cat);
    te.appendChild(tab);
    const list=document.createElement("div");
    list.className="list"+(cat===activeTab?" active":"");
    list.id="list-"+cat;
    if(cat!=="Favoriter"){
      STOCKS[cat].forEach(s=>list.appendChild(buildCard(s)));
    }
    le.appendChild(list);
  });
  buildFavoriterTab();
}

function buildCard(s){
  const live=s.sym?liveData[s.sym]:null;
  const has=live?.ok;
  const signal=has?live.signal:"HALL";
  const styrka=has?live.styrka:5;
  const c=COLORS[signal],bg=BGS[signal];
  const card=document.createElement("div");
  card.className="card";
  card.style.setProperty("--c",c);card.style.setProperty("--bg",bg);
  const dots=Array.from({length:10},(_,i)=>`<div class="dot${i<styrka?" on":""}"></div>`).join("");
  let chHtml="",techHtml="",priceHtml="";
  if(has){
    const cc=live.change>=0?"#00cc66":"#ff4444";
    chHtml=`<span class="card-change" style="color:${cc}">${live.change>=0?"+":""}${live.change.toFixed(1)}%</span>`;
    priceHtml=`<span class="card-price">${live.price.toFixed(2)}</span>`;
    const rc=live.rsi<35?"#00cc66":live.rsi>65?"#ff4444":"#ffaa00";
    const mc=(live.ma50&&live.ma200)?(live.ma50>live.ma200?"#00cc66":"#ff4444"):"#555";
    techHtml=`<div class="tech-row">
      <span class="tech-badge" style="color:#ccc;border-color:#333">${live.price.toFixed(2)}</span>
      ${live.rsi!=null?`<span class="tech-badge" style="color:${rc};border-color:${rc}44">RSI ${live.rsi}</span>`:""}
      ${live.ma50!=null?`<span class="tech-badge" style="color:${mc};border-color:${mc}44">MA50 ${live.ma50}</span>`:""}
      ${live.ma200!=null?`<span class="tech-badge" style="color:${mc};border-color:${mc}44">MA200 ${live.ma200}</span>`:""}
    </div>`;
  }else if(!s.sym){
    techHtml=`<div class="tech-row"><span class="tech-badge" style="color:#333">Teknisk data ej tillgänglig för fonder</span></div>`;
  }else if(live&&!live.ok){
    techHtml=`<div class="tech-row"><span class="tech-badge" style="color:#666;border-color:#333">Ej tillgänglig just nu</span></div>`;
  }else{
    techHtml=`<div class="tech-row"><span class="tech-badge" style="color:#444">Tryck Uppdatera för livedata</span></div>`;
  }
  const sum={
    KOP:`Teknisk analys pekar uppåt.${live?.rsi?` RSI ${live.rsi} indikerar köpläge.`:""}${(live?.ma50&&live?.ma200&&live.ma50>live.ma200)?" MA50 över MA200 — positiv trend.":""}`,
    HALL:`Teknisk analys neutral.${live?.rsi?` RSI ${live.rsi} i neutralt läge.`:""} Avvakta tydligare signal.`,
    SALJ:`Teknisk analys pekar nedåt.${live?.rsi?` RSI ${live.rsi} — överköpt läge.`:""}${(live?.ma50&&live?.ma200&&live.ma50<live.ma200)?" MA50 under MA200 — negativ trend.":""}`,
  };
  const summary=has?sum[signal]:"Tryck Uppdatera för teknisk analys.";
  const reasons=s.anledningar.map(r=>`<div class="reason-row"><span class="reason-icon">▸</span><span>${r}</span></div>`).join("");
  const risks=s.risker.map(r=>`<div class="risk-row"><span class="risk-icon">⚠</span><span>${r}</span></div>`).join("");
  card.innerHTML=`
    <button class="card-row" onclick="toggleCard(this)">
      <div class="card-left"><span class="card-ticker">${s.display}</span><span class="card-sektor">${s.sektor}</span>${s.smeknamn?`<span class="card-smeknamn">${s.smeknamn}</span>`:""} ${has&&live.price?`<span class="card-live-price">${live.price.toFixed(2)} <span style="color:#555;font-size:9px">${s.valuta||""}</span></span>`:'<span class="card-live-price" style="color:#2a2a2a">—</span>'}</div>
      <div class="dots">${dots}</div>
      <div class="card-right">${s.sym?`<span class="heart${favorites.has(s.sym)?" fav":""}" onclick="toggleFav(event,'${s.sym}')">♥</span>`:""} ${chHtml}<span class="card-signal">${TAGS[signal]}</span><span class="card-arrow">▼</span></div>
    </button>
    <div class="card-body">
      <div class="bar-track"><div class="bar-fill" style="width:${styrka*10}%"></div></div>
      <div class="card-name-row"><div style="display:flex;flex-direction:column;gap:2px"><span class="card-name">${s.namn}</span>${has&&live.price?`<span style="font-size:11px;color:#aaa;font-family:monospace">${live.price.toFixed(2)}</span>`:""}</div><span class="card-styrka">Styrka ${styrka}/10</span></div>
      ${techHtml}
      <div class="summary">${summary}</div>
      <div class="section-label">${VARFOR[signal]}</div>${reasons}
      <div class="risks"><div class="section-label">RISKER</div>${risks}</div>
      <a class="invest-btn" href="${s.avanza}" target="_blank">INVESTERA PÅ AVANZA →</a>
    </div>`;
  return card;
}

function toggleFav(e, sym){
  e.stopPropagation();
  if(favorites.has(sym)){
    favorites.delete(sym);
  } else {
    favorites.add(sym);
  }
  localStorage.setItem("fav", JSON.stringify([...favorites]));
  // Update all hearts for this sym
  document.querySelectorAll(".heart").forEach(h=>{
    if(h.getAttribute("onclick")&&h.getAttribute("onclick").includes(sym)){
      h.classList.toggle("fav", favorites.has(sym));
    }
  });
  // Rebuild Favoriter tab if active
  if(activeTab==="Favoriter") buildFavoriterTab();
}

function buildFavoriterTab(){
  const list=document.getElementById("list-Favoriter");
  if(!list)return;
  list.innerHTML="";
  const favStocks=Object.values(STOCKS).flat().filter(s=>s.sym&&favorites.has(s.sym));
  if(favStocks.length===0){
    list.innerHTML='<div style="text-align:center;color:#333;font-size:12px;padding:40px 20px;letter-spacing:2px">INGA FAVORITER ÄNNU<br><span style="font-size:10px;margin-top:8px;display:block">Tryck ♥ på en aktie för att lägga till</span></div>';
  } else {
    favStocks.forEach(s=>list.appendChild(buildCard(s)));
  }
}

function switchTab(cat){
  activeTab=cat;
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",categories[i]===cat));
  document.querySelectorAll(".list").forEach(l=>l.classList.toggle("active",l.id==="list-"+cat));
  if(cat==="Favoriter")buildFavoriterTab();
}
function toggleCard(btn){
  const card=btn.closest(".card");
  const was=card.classList.contains("open");
  document.querySelectorAll(".card.open").forEach(c=>c.classList.remove("open"));
  if(!was)card.classList.add("open");
}

async function refreshAll(){
  const btn=document.getElementById("refresh-btn");
  const icon=document.getElementById("refresh-icon");
  const loading=document.getElementById("loading");
  const sub=document.getElementById("loading-sub");
  const bar=document.getElementById("loading-bar");
  const errC=document.getElementById("err-container");
  btn.disabled=true;icon.className="spin";loading.style.display="flex";errC.innerHTML="";
  sub.textContent="Laddar marknadsdata...";
  bar.style.width="30%";
  const updated = await loadData();
  bar.style.width="80%";
  const all=Object.values(STOCKS).flat().filter(s=>s.sym);
  let ok=0;
  all.forEach(s=>{
    loadStock(s);
    if(liveData[s.sym]?.ok)ok++;
  });
  bar.style.width="100%";
  loading.style.display="none";
  buildUI();
  if(updated){
    document.getElementById("last-updated").textContent=`Data från: ${updated}`;
  }
  document.getElementById("status-text").textContent=`${ok}/${all.length} aktier laddade`;
  btn.disabled=false;icon.className="";
  if(ok===0){
    errC.innerHTML=`<div class="info-banner">⚠️ Ingen data hittades. GitHub Actions har kanske inte körts än — vänta till imorgon eller kör den manuellt.</div>`;
  } else if(ok<all.length){
    errC.innerHTML=`<div class="info-banner">ℹ️ ${all.length-ok} aktier saknar data.</div>`;
  }
}

buildUI();
</script>
</body>
</html>
